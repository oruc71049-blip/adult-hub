<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adult Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #141414; /* Tək rəngli tünd fon */
            color: #dcdcdc;
            min-height: 100vh;
        }
        header {
            background-color: #1a1a1a;
            padding: 20px 40px;
            border-bottom: 2px solid #b30000;
        }
        header h1 {
            color: #ff1a1a;
            font-size: 26px;
            letter-spacing: 1px;
        }
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        
        /* İçə batan (Inset) panel */
        .admin-panel {
            background-color: #181818;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 40px;
            box-shadow: inset 4px 4px 8px rgba(0, 0, 0, 0.7), 
                        inset -4px -4px 8px rgba(255, 255, 255, 0.02);
            border: 1px solid #222;
        }
        .admin-panel h3 {
            margin-bottom: 20px;
            color: #ff1a1a;
            font-weight: 500;
        }
        
        /* İçə batan input sahələri */
        .admin-panel input[type="text"], 
        .admin-panel input[type="file"] {
            width: 100%;
            padding: 14px 18px;
            margin-bottom: 15px;
            background-color: #101010;
            border: 1px solid #262626;
            color: #fff;
            border-radius: 8px;
            box-shadow: inset 3px 3px 6px rgba(0, 0, 0, 0.8), 
                        inset -3px -3px 6px rgba(255, 255, 255, 0.01);
            outline: none;
        }
        .admin-panel input[type="text"]:focus {
            border-color: #ff1a1a;
        }
        .admin-panel input[type="file"] {
            padding: 10px;
            cursor: pointer;
        }

        /* Qabarıq qırmızı düymə */
        .admin-panel button {
            background-color: #cc0000;
            color: white;
            border: none;
            padding: 12px 25px;
            cursor: pointer;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(204, 0, 0, 0.4);
            transition: background 0.2s;
        }
        .admin-panel button:hover {
            background-color: #ff1a1a;
        }

        h2 {
            font-weight: 400;
            color: #aaa;
            margin-bottom: 20px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .video-card {
            background-color: #181818;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #262626;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
        }
        .video-frame {
            width: 100%;
            height: 180px;
            background-color: #000;
        }
        .video-frame video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-info {
            padding: 15px;
        }
        .video-title {
            font-size: 15px;
            font-weight: 500;
            color: #eee;
        }
        .no-video {
            color: #555;
            text-align: center;
            grid-column: 1 / -1;
            padding: 50px;
            font-size: 16px;
            background-color: #181818;
            border-radius: 10px;
            box-shadow: inset 3px 3px 6px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body>

    <header>
        <h1>AdultHub AZ</h1>
    </header>

    <div class="container">
        <div class="admin-panel">
            <h3>Video Yüklə</h3>
            <input type="text" id="videoTitle" placeholder="Video Başlığı...">
            <input type="file" id="videoFile" accept="video/*">
            <button onclick="uploadVideo()">Paylaş</button>
        </div>

        <h2>Videolar</h2>
        <div class="video-grid" id="videoContainer">
            <div class="no-video" id="noVideoText">Hələ ki, video yoxdur.</div>
        </div>
    </div>

    <script>
        function uploadVideo() {
            let title = document.getElementById("videoTitle").value;
            let fileInput = document.getElementById("videoFile");

            if (!title || fileInput.files.length === 0) {
                alert("Zəhmət olmasa başlığı yazın və fayl seçin!");
                return;
            }

            let file = fileInput.files[0];
            let videoUrl = URL.createObjectURL(file);

            let container = document.getElementById("videoContainer");
            let noVideoText = document.getElementById("noVideoText");

            if (noVideoText) {
                noVideoText.remove();
            }

            let card = document.createElement("div");
            card.className = "video-card";
            card.innerHTML = `
                <div class="video-frame">
                    <video src="${videoUrl}" controls></video>
                </div>
                <div class="video-info">
                    <div class="video-title">${title}</div>
                </div>
            `;

            container.prepend(card);

            document.getElementById("videoTitle").value = "";
            fileInput.value = "";
        }
    </script>

</body>
</html>
